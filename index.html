<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 식물 진단 주치의</title>
  <style>
    /* 기존 스타일 그대로 유지 */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .phone-frame { width: 100%; max-width: 400px; height: 750px; background: #fff; border-radius: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; position: relative; border: 6px solid #111; }
    .header { background: #fff; padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
    .card-toggle-btn { background: #f1f3f5; color: #212529; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .compare-container { height: 360px; display: flex; position: relative; overflow: hidden; background: #000; }
    .img-box { width: 50%; height: 100%; position: relative; overflow: hidden; border-right: 1px solid #eee; }
    .img-box:last-child { border-right: none; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease; cursor: zoom-in; }
    .img-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.5); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; z-index: 10; }
    .status-tabs { display: flex; background: #fff; padding: 8px; gap: 6px; border-bottom: 1px solid #eee; }
    .tab-btn { flex: 1; padding: 10px 4px; border: none; border-radius: 8px; background: #f8f9fa; color: #868e96; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #2b8a3e; color: #fff; }
    .content-area { padding: 20px; text-align: center; color: #495057; font-size: 14px; flex: 1; display: flex; align-items: center; justify-content: center; }
    .floating-ai-btn { position: absolute; bottom: 20px; right: 20px; width: 56px; height: 56px; background: #2b8a3e; color: #fff; border: none; border-radius: 50%; box-shadow: 0 4px 15px rgba(43, 138, 62, 0.4); cursor: pointer; z-index: 50; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: transform 0.2s; }
    .floating-ai-btn:hover { transform: scale(1.05); }
    .chat-modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; flex-direction: column; justify-content: flex-end; z-index: 90; }
    .chat-modal-content { background: #fff; width: 100%; height: 80%; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); }
    .chat-header { padding: 16px; border-bottom: 1px solid #f1f3f5; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: #212529; }
    .chat-close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #868e96; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg-box { max-width: 80%; padding: 12px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-all; }
    .msg-ai { background: #f8f9fa; color: #212529; align-self: flex-start; border-top-left-radius: 4px; }
    .msg-user { background: #2b8a3e; color: #fff; align-self: flex-end; border-top-right-radius: 4px; }
    .chat-input-bar { padding: 12px 16px; border-top: 1px solid #f1f3f5; display: flex; align-items: center; gap: 8px; background: #fff; }
    .file-upload-btn { background: #f1f3f5; color: #495057; width: 38px; height: 38px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
    .chat-text-input { flex: 1; border: 1px solid #e9ecef; border-radius: 20px; padding: 10px 14px; font-size: 14px; outline: none; background: #f8f9fa; }
    .chat-send-btn { background: none; border: none; font-weight: 600; color: #2b8a3e; cursor: pointer; padding: 0 8px; font-size: 14px; }
    #file-input { display: none; }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="header">
      <button class="card-toggle-btn">🌿 <span id="plant-name-btn">나만의 식물 주치의</span> ▾</button>
    </div>

    <!-- 반반 비교 화면 -->
    <div class="compare-container">
      <div class="img-box" id="my-img-box">
        <span class="img-label">내 식물 (터치 줌)</span>
        <img id="my-plant-img" src="https://images.unsplash.com/photo-1614594975525-e45190c55d0b?w=500&auto=format&fit=crop&q=80">
      </div>
      <div class="img-box" id="ref-img-box">
        <span class="img-label" id="ref-label">비교: 물 부족</span>
        <img id="ref-plant-img" src="https://images.unsplash.com/photo-1599598425947-d35053fd4f00?w=500&auto=format&fit=crop&q=80">
      </div>
    </div>

    <!-- 상태 버튼 -->
    <div class="status-tabs">
      <button class="tab-btn active">💧 물 부족</button>
      <button class="tab-btn">☀️ 빛 과다</button>
      <button class="tab-btn">🌿 정상/건강</button>
    </div>

    <div class="content-area">
      <p>궁금한 식물이 있다면<br>우측 하단의 <b>🌿 주치의 버튼</b>을 눌러보세요!</p>
    </div>

    <button class="floating-ai-btn" onclick="toggleChat(true)">🌿</button>

    <div class="chat-modal-overlay" id="chat-modal">
      <div class="chat-modal-content">
        <div class="chat-header">
          <span>🌿 다정한 꽃집 사장님</span>
          <button class="chat-close-btn" onclick="toggleChat(false)">✕</button>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="msg-box msg-ai">
            <b>식집사님 안녕~ 🌷</b><br>
            난 동네에서 제일 다정한 꽃집 사장님이야!<br>
            우리 초록이들이 어디가 아픈지 사진을 찰칵 찍어 보여줄래?
          </div>
        </div>
        <div class="chat-input-bar">
          <button class="file-upload-btn" onclick="document.getElementById('file-input').click()">📷</button>
          <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleImageSelect(event)">
          <input type="text" class="chat-text-input" id="chat-input" placeholder="식물 상태를 물어보세요..." onkeypress="if(event.key === 'Enter') sendMessage()">
          <button class="chat-send-btn" onclick="sendMessage()">전송</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ★ 여기에 발급받은 API 키를 꼭 붙여넣어 줘! ★
    const API_KEY = 'AQ.Ab8RN6LaqtQwl7hqJwT3f8GvVFA10OdwdUCVTxyXwwq-VCETDQ'; 
    
    let currentImageBase64 = null;

    function toggleChat(show) { document.getElementById('chat-modal').style.display = show ? 'flex' : 'none'; }
    
    function appendMessage(text, sender) {
      const msgBox = document.createElement('div');
      msgBox.className = `msg-box msg-${sender}`;
      msgBox.innerHTML = text;
      const container = document.getElementById('chat-messages');
      container.appendChild(msgBox);
      container.scrollTop = container.scrollHeight;
    }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentImageBase64 = e.target.result.split(',')[1];
          appendMessage(`[📸 사진 첨부 완료: ${file.name}]<br>이제 상태를 물어봐 줘!`, 'user');
        };
        reader.readAsDataURL(file);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text && !currentImageBase64) return;

      appendMessage(text || "이 식물 상태 좀 봐주세요!", 'user');
      input.value = '';
      appendMessage("음~ 사진을 자세히 보고 있어! 1초만 기다려줘~ 🌷", 'ai');

      try {
        const promptText = "너는 다정다감하고 친절한 동네 꽃집 사장님이야. 초보 식집사의 마음을 다독이며 반말로 친근하게 대답해줘. 이모지도 많이 써줘. 사진 속 식물이 무엇인지, 상태가 어떤지 진단하고 3줄 이내로 짧고 명확하게 해결책을 알려줘. 사용자의 질문: " + text;
        
        let contents = [{ parts: [{text: promptText}] }];
        if (currentImageBase64) {
          contents[0].parts.push({
            inlineData: { mimeType: "image/jpeg", data: currentImageBase64 }
          });
        }

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: contents })
        });

        const data = await response.json();
        const aiText = data.candidates[0].content.parts[0].text;
        
        // 로딩 메시지 삭제 후 진짜 답변 달기
        const chatContainer = document.getElementById('chat-messages');
        chatContainer.removeChild(chatContainer.lastChild);
        appendMessage(aiText.replace(/\n/g, '<br>'), 'ai');
        currentImageBase64 = null; // 사진 초기화
      } catch (error) {
        appendMessage("앗, 지금 꽃집에 손님이 많아서 대답하기가 힘들어! 다시 한 번 물어봐 줄래? 😭", 'ai');
      }
    }
  </script>
</body>
</html>
