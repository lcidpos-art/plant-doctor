<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 식물 진단 주치의</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    
    .phone-frame {
      width: 100%; max-width: 400px; height: 750px; background: #fff;
      border-radius: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden; display: flex; flex-direction: column; position: relative;
      border: 8px solid #222;
    }
    
    .header { background: #111; color: #fff; padding: 12px; text-align: center; }
    .card-toggle-btn {
      background: #27ae60; color: #fff; border: none; padding: 8px 16px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px;
      box-shadow: 0 2px 8px rgba(39, 174, 96, 0.4);
    }
    
    .scan-bar { background: #f8f9fa; padding: 8px; text-align: center; border-bottom: 1px solid #eee; }
    .scan-btn {
      background: #222; color: #fff; border: none; padding: 6px 12px;
      border-radius: 8px; font-size: 12px; cursor: pointer;
    }

    /* 가독성 수정: 높이를 360px로 고정해 화면에 넘치지 않게 맞춤! */
    .compare-container {
      height: 360px; display: flex; position: relative; overflow: hidden; background: #000;
    }
    .img-box {
      width: 50%; height: 100%; position: relative; overflow: hidden; border-right: 1px solid #444;
    }
    .img-box:last-child { border-right: none; }
    .img-box img {
      width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease;
      cursor: zoom-in;
    }
    .img-label {
      position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6);
      color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; z-index: 10;
    }

    .status-tabs { display: flex; background: #222; padding: 6px; gap: 6px; }
    .tab-btn {
      flex: 1; padding: 8px 4px; border: none; border-radius: 8px;
      background: #333; color: #aaa; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .tab-btn.active { background: #27ae60; color: #fff; }

    .footer-action { padding: 12px; background: #fff; border-top: 1px solid #eee; margin-top: auto; }
    .ai-btn {
      width: 100%; padding: 14px; background: #2ecc71; color: #fff; border: none;
      border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer;
    }

    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; justify-content: center;
      align-items: center; z-index: 100; padding: 20px;
    }
    .insta-card {
      background: #fff; width: 100%; border-radius: 20px; overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .insta-header {
      background: #fafafa; padding: 12px 16px; border-bottom: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
    }
    .insta-content { padding: 20px; max-height: 400px; overflow-y: auto; font-size: 14px; line-height: 1.6; }
    .tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 4px; font-size: 11px; margin-right: 4px; }
    .close-modal-btn { background: none; border: none; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="header">
      <button class="card-toggle-btn" onclick="toggleModal(true)">🌿 <span id="plant-name-btn">몬스테라</span> 요약 카드 보기 ▾</button>
    </div>

    <div class="scan-bar">
      <button class="scan-btn" onclick="scanRandomPlant()">📸 식물 카메라 인식 (테스트 스캔)</button>
    </div>

    <!-- 사진 크기 가독성 및 엑스박스 완벽 해결 영역 -->
    <div class="compare-container">
      <div class="img-box" id="my-img-box">
        <span class="img-label">내 식물 (터치 줌)</span>
        <img id="my-plant-img" src="https://images.unsplash.com/photo-1614594975525-e45190c55d0b?w=500&auto=format&fit=crop&q=80" alt="내 식물">
      </div>
      <div class="img-box" id="ref-img-box">
        <span class="img-label" id="ref-label">비교: 물 부족</span>
        <!-- 엑스박스 안 뜨는 안전한 고화질 이미지 링크로 수정! -->
        <img id="ref-plant-img" src="https://images.unsplash.com/photo-1599598425947-d35053fd4f00?w=500&auto=format&fit=crop&q=80" alt="예시 식물">
      </div>
    </div>

    <div class="status-tabs">
      <button class="tab-btn active" onclick="changeStatus('water')">💧 물 부족</button>
      <button class="tab-btn" onclick="changeStatus('light')">☀️ 빛 과다</button>
      <button class="tab-btn" onclick="changeStatus('healthy')">🌿 정상/건강</button>
    </div>

    <div class="footer-action">
      <button class="ai-btn" onclick="alert('다정한 식물 친구 AI와 상담을 시작합니다!')">💬 다정한 식물 친구 AI에게 맞춤 처방전 받기</button>
    </div>

    <div class="modal-overlay" id="insta-modal">
      <div class="insta-card">
        <div class="insta-header">
          <strong id="modal-title">🌿 @monsta_home_kr</strong>
          <button class="close-modal-btn" onclick="toggleModal(false)">✕</button>
        </div>
        <div class="insta-content">
          <p id="modal-desc"></p>
          <div style="margin-top: 12px;" id="modal-tags"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 엑스박스 없는 안전한 이미지 링크 DB
    const plantDB = {
      monstera: {
        name: "몬스테라",
        instaHandle: "🌿 @monsta_home_kr",
        myImg: "https://images.unsplash.com/photo-1614594975525-e45190c55d0b?w=500&auto=format&fit=crop&q=80",
        refImgs: {
          water: "https://images.unsplash.com/photo-1599598425947-d35053fd4f00?w=500&auto=format&fit=crop&q=80",
          light: "https://images.unsplash.com/photo-1632207191677-8446985f9d65?w=500&auto=format&fit=crop&q=80",
          healthy: "https://images.unsplash.com/photo-1614594975525-e45190c55d0b?w=500&auto=format&fit=crop&q=80"
        },
        storyText: "오늘도 평화로운 우리 집 🌿<br>초보 집사랑도 10년은 끄떡없는 프로 생존러, 그게 바로 나야!<br><br><b>💧 물주기:</b> 겉흙 마르면 흠뻑<br><b>☀️ 햇살맛집:</b> 따뜻한 반양지<br><b>🚨 SOS:</b> 잎 끝이 타면 바람을 쐬어줘!",
        tags: ["#몬스테라", "#플랜테리어", "#프로생존러"]
      },
      areca: {
        name: "아레카야자",
        instaHandle: "🌴 @areca_air_kr",
        myImg: "https://images.unsplash.com/photo-1597055181308-e3a479268305?w=500&auto=format&fit=crop&q=80",
        refImgs: {
          water: "https://images.unsplash.com/photo-1512428813834-c702c7702b78?w=500&auto=format&fit=crop&q=80",
          light: "https://images.unsplash.com/photo-1597055181308-e3a479268305?w=500&auto=format&fit=crop&q=80",
          healthy: "https://images.unsplash.com/photo-1597055181308-e3a479268305?w=500&auto=format&fit=crop&q=80"
        },
        storyText: "천연 공기청정기 1등, 나 아레카야자 왔어! 🌴<br>노란 잎은 자연스러운 탈피일 수도 있으니 너무 걱정 마!<br><br><b>💧 물주기:</b> 촉촉하게 유지<br><b>☀️ 햇살맛집:</b> 직사광선 피한 그늘<br><b>🚨 SOS:</b> 건조하면 잎 끝이 갈색으로 변해!",
        tags: ["#아레카야자", "#공기청정식물", "#촉촉한흙"]
      }
    };

    let currentPlantKey = 'monstera';
    let currentStatus = 'water';

    function renderPlant() {
      const plant = plantDB[currentPlantKey];
      document.getElementById('plant-name-btn').innerText = plant.name;
      document.getElementById('my-plant-img').src = plant.myImg;
      document.getElementById('modal-title').innerText = plant.instaHandle;
      document.getElementById('modal-desc').innerHTML = plant.storyText;
      
      const tagsContainer = document.getElementById('modal-tags');
      tagsContainer.innerHTML = '';
      plant.tags.forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerText = t;
        tagsContainer.appendChild(span);
      });
      updateRefImage();
    }

    function changeStatus(status) {
      currentStatus = status;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      const labelMap = { water: "비교: 물 부족", light: "비교: 빛 과다", healthy: "비교: 정상/건강" };
      document.getElementById('ref-label').innerText = labelMap[status];
      updateRefImage();
    }

    function updateRefImage() {
      document.getElementById('ref-plant-img').src = plantDB[currentPlantKey].refImgs[currentStatus];
    }

    function scanRandomPlant() {
      const keys = Object.keys(plantDB);
      currentPlantKey = keys.find(k => k !== currentPlantKey) || keys[0];
      renderPlant();
    }

    function toggleModal(show) {
      document.getElementById('insta-modal').style.display = show ? 'flex' : 'none';
    }

    // 1:1 동시 줌인
    const myImg = document.getElementById('my-plant-img');
    const refImg = document.getElementById('ref-plant-img');
    let isZoomed = false;

    document.getElementById('my-img-box').addEventListener('click', () => {
      isZoomed = !isZoomed;
      const scale = isZoomed ? 'scale(2.2)' : 'scale(1)';
      myImg.style.transform = scale;
      refImg.style.transform = scale;
    });

    renderPlant();
  </script>
</body>
</html>
